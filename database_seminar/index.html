<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年度 データベース演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #1a5e45;
  --color-accent: #27ae60;
  --color-light: #eafaf1;
  --color-bg: #fafbfc;
  --color-text: #2c3e50;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.7;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}
header {
  background: var(--color-primary);
  color: white;
  padding: 1.5rem 0;
  margin-bottom: 2rem;
}
header .container {
  padding-top: 0;
  padding-bottom: 0;
}
header h1 {
  font-size: 1.4rem;
  font-weight: 700;
}
header .subtitle {
  font-size: 0.9rem;
  opacity: 0.85;
  margin-top: 0.25rem;
}
a {
  color: var(--color-accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
.breadcrumb {
  font-size: 0.85rem;
  margin-bottom: 1.5rem;
  color: #888;
}
.breadcrumb a {
  color: #888;
}
.breadcrumb a:hover {
  color: var(--color-accent);
}

.news {
  margin-bottom: 2rem;
  padding: 1rem 1.2rem;
  background: #fffbe6;
  border: 1px solid #f0e68c;
  border-radius: 6px;
}
.news h2 {
  font-size: 1rem;
  color: var(--color-primary);
  margin-bottom: 0.5rem;
}
.news ul {
  list-style: none;
  font-size: 0.9rem;
}
.news li {
  margin-bottom: 0.2rem;
}
.news .date {
  color: #888;
  margin-right: 0.5rem;
}
.docs {
  margin-bottom: 2rem;
}
.docs h2 {
  font-size: 1.1rem;
  color: var(--color-primary);
  border-bottom: 2px solid var(--color-light);
  padding-bottom: 0.4rem;
  margin-bottom: 0.8rem;
}
.docs ul {
  list-style: none;
}
.docs li {
  margin-bottom: 0.4rem;
}
.docs a {
  display: inline-block;
  padding: 0.4rem 0.8rem;
  background: var(--color-light);
  border-radius: 4px;
  font-size: 0.95rem;
  transition: background 0.15s;
}
.docs a:hover {
  background: #a9dfbf;
  text-decoration: none;
}
.lecture-list {
  list-style: none;
}
.lecture-list li {
  margin-bottom: 0.5rem;
}
.lecture-card {
  display: block;
  padding: 0.9rem 1.2rem;
  background: white;
  border: 1px solid #e0e6ed;
  border-radius: 6px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.lecture-card:hover {
  border-color: var(--color-accent);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  text-decoration: none;
}
.lecture-card .num {
  font-weight: 700;
  color: var(--color-primary);
}
.lecture-card .date {
  font-size: 0.85rem;
  color: #888;
  margin-left: 0.5rem;
}
.lecture-card .topic {
  display: block;
  font-size: 0.85rem;
  color: #666;
  margin-top: 0.2rem;
}
.lecture-card .sections {
  font-size: 0.8rem;
  color: #aaa;
  margin-left: 0.75rem;
}
footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid #e0e6ed;
  font-size: 0.8rem;
  color: #aaa;
}

</style>
</head>
<body>
<header>
  <div class="container">

  </div>
</header>
<div class="container">

  <div class="docs">

    <li><a href="docs/課題提出方法.pdf" target="_blank">課題提出方法</a></li>

  </ul>
</div>
  <ul class="lecture-list">

  </ul>
  <footer>
    提出・連絡は <a href="https://webclass.kaishi-pu.ac.jp/webclass/">WebClass</a> から行ってください。
  </footer>
</div>
</body>
</html>
